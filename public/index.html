<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meow & Butterfly Loyalty Club</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<div id="login" class="card pink" style="margin-top:40px;text-align:center"><div style="width:90px;margin:auto" id="lg"></div><h1 style="font-size:34px">Meow & Butterfly Club</h1><p class="muted">Masuk pakai Member ID & kode akses kamu ✿</p>
<input id="mid" placeholder="Member ID" autocapitalize="none"><input id="code" placeholder="Kode akses" type="password"><button id="go" style="width:100%">Masuk</button><p id="e" class="err"></p></div>
<div id="app" class="hidden"></div></div>
<dialog id="dlg"><h2 class="hand">Klaim Garansi</h2><p id="dp" class="muted"></p><textarea id="dm" rows="4" placeholder="Ceritakan masalahnya…"></textarea><p id="de" class="err"></p><div class="row"><button class="g" id="ds">Kirim</button><button class="p" onclick="dlg.close()">Batal</button></div></dialog>
<script src="app.js"></script><script>
$('#lg').innerHTML=cat('#fff');let cw=null;
async function load(){try{const d=await api('me');render(d);$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}catch(e){if(e.status===401){sessionStorage.clear();$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}}}
$('#go').onclick=async()=>{$('#e').textContent='';try{const r=await api('login',{member_id:$('#mid').value,code:$('#code').value},null);sessionStorage.setItem('tk',r.token);sessionStorage.setItem('cd',$('#code').value.trim().toUpperCase());load()}catch(e){$('#e').textContent=e.message}};
function logout(){sessionStorage.clear();location.reload()}
function wstat(w){const d=days(w.end_date);return d<0?['Berakhir','x',d]:d<=3?['Segera habis','r',d]:['Aktif','',d]}
function render({customer:c,orders:o,warranties:w,vouchers:v}){
 const done=o.filter(x=>x.status==='selesai'),act=w.filter(x=>days(x.end_date)>=0).length,cd=sessionStorage.getItem('cd')||'••••••';
 $('#app').innerHTML=`<h2>🎀 My Loyalty Card</h2><div class="card pink"><div class="deco">${bf('#e4d9ff')}</div><div class="muted">nama</div><div class="hand" style="font-size:32px">${esc(c.name)}</div>
 <div class="muted">Member ID</div><div class="code">${esc(c.member_id)}</div><div class="muted" style="margin-top:8px">Kode akses</div><div class="row"><span class="code" id="cv">••••••</span><button class="sm" id="sh">👁</button><button class="sm g" id="cp">salin</button><button class="sm p" onclick="logout()">keluar</button></div></div>
 <h2>🐾 Stamp Card</h2><div class="card but"><div class="stamps">${Array.from({length:10},(_,i)=>`<div class="st ${i<c.stamps?'on':''}" style="--i:${i}">${i<c.stamps?stampArt(i):i+1}</div>`).join('')}</div>
 <div class="bar"><i style="width:${c.stamps*10}%"></i></div><div class="muted">${c.stamps}/10 stamp · <b>${10-c.stamps} lagi</b> dapat voucher 10% (maks Rp15.000) · 1 pesanan selesai = 1 stamp ✿</div></div>
 <h2>📊 Statistik</h2><div class="stats"><div class="card lav"><b>${o.length}</b>pesanan</div><div class="card sage"><b>${rp(done.reduce((s,x)=>s+x.price*x.qty,0))}</b>total belanja</div><div class="card pink"><b>${act}</b>garansi aktif</div><div class="card but"><b>${D(c.joined_at)}</b>bergabung</div></div>
 <h2>🛡 My Warranty Cards</h2>${w.map(x=>{const[s,k,d]=wstat(x),tot=(new Date(x.end_date)-new Date(x.start_date))/864e5||1,pc=Math.max(0,Math.min(100,100-d/tot*100));
 return`<div class="card"><div class="row sp"><b>${esc(x.product)}</b><span class="tag ${k}">${s}${d>=0?' · sisa '+d+' hari':''}</span></div><div class="muted">${esc(x.plan||'')} · ${D(x.start_date)} → ${D(x.end_date)}</div><div class="bar"><i style="width:${d<0?100:pc}%"></i></div>${d>=0?`<button class="sm" data-w="${x.id}" data-n="${esc(x.product)}">klaim garansi</button>`:''}</div>`}).join('')||'<div class="card muted">Belum ada garansi.</div>'}
 <h2>📒 My Order History</h2>${o.map(x=>`<div class="card nota"><div class="row sp"><b class="hand" style="font-size:20px">${esc(x.nota_no)}</b><span class="tag ${x.status==='selesai'?'':x.status==='batal'?'x':'y'}">${x.status}</span></div><div>${esc(x.product)} ${x.plan?'· '+esc(x.plan):''} ×${x.qty}</div><div class="row sp"><span class="muted">${D(x.created_at)}</span><b>${rp(x.price*x.qty)}</b></div>
 <details><summary class="muted">detail</summary><div class="muted">Harga satuan ${rp(x.price)} · ${x.stamped?'🐾 stamp sudah diberikan':'belum dapat stamp'}${w.filter(g=>g.order_id===x.id).map(g=>'<br>Garansi s/d '+D(g.end_date)).join('')}</div></details></div>`).join('')||'<div class="card muted">Belum ada pesanan.</div>'}
 <h2>🎁 My Rewards</h2>${v.map(x=>{const used=x.used_at,exp=days(x.expires_at)<0;return`<div class="card ${used||exp?'':'but'}"><div class="row sp"><span class="code">${esc(x.code)}</span><span class="tag ${used||exp?'x':''}">${used?'terpakai':exp?'kedaluwarsa':'tersedia'}</span></div><div>Diskon ${x.discount_pct}% (maks ${rp(x.max_amount)}) · sekali pakai</div><div class="muted">berlaku s/d ${D(x.expires_at)}</div></div>`}).join('')||'<div class="card muted">Kumpulkan 10 stamp untuk voucher pertamamu ✿</div>'}`;
 let shown=false;$('#sh').onclick=()=>{shown=!shown;$('#cv').textContent=shown?cd:'••••••'};$('#cp').onclick=()=>navigator.clipboard.writeText(c.member_id+' / '+cd).then(()=>$('#cp').textContent='tersalin!');
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{cw=b.dataset.w;$('#dp').textContent=b.dataset.n;$('#dm').value='';$('#de').textContent='';dlg.showModal()})}
$('#ds').onclick=async()=>{try{await api('claim',{warranty_id:cw,message:$('#dm').value});dlg.close();alert('Klaim terkirim ✿ Admin akan menghubungi kamu')}catch(e){$('#de').textContent=e.message}};
if(sessionStorage.getItem('tk'))load();setInterval(()=>sessionStorage.getItem('tk')&&!document.hidden&&!dlg.open&&load(),30000);
</script></body></html>
